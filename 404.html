<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Jacob Qumsiyeh</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=22">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .error-code {
      font-family: var(--font-mono);
      color: var(--red);
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
    }

    .error-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      margin-bottom: 14px;
    }

    .error-sub {
      color: var(--grey);
      max-width: 440px;
      margin-bottom: 36px;
    }

    .error-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">This page doesn't exist.</h1>
    <p class="error-sub">The link might be broken, or the page may have moved. Let's get you back on track.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary btn-lg">
        <span>Back to Home</span>
      </a>
      <a href="/#contact" class="btn btn-ghost btn-lg">
        <span>Contact Me</span>
      </a>
    </div>
  </div>
</body>

</html>
